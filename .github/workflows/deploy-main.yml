name: Deploy to Production

# Manual only: Actions → "Deploy to Production" → Run workflow (from main, or staging to test first).
# Mirrors qeen-web-ui's deploy-main.yml: same prod project, credentials, registry and region.
on:
  workflow_dispatch:
  # TEMPORARY: GitHub only shows "Run workflow" once this file is on main, so while testing from
  # staging a push to staging triggers the deploy. Remove this before merging to main.
  push:
    branches: [staging]

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROD_PROJECT_ID }}
  SERVICE_NAME: astrolabe-ui-prod
  GCP_REGION: europe-west1

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Reject dispatch from other branches
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging'
        run: |
          echo "❌ Can only dispatch from main or staging."
          exit 1

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_PROD_CREDENTIALS }}
      - run: gcloud auth configure-docker --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          # NEXT_PUBLIC_* values are inlined at build time
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.ASTROLABE_API_URL }}
          cache-from: type=gha,scope=main
          cache-to: type=gha,mode=max,scope=main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_PROD_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@v2
      # Only the image changes per deploy. Env vars, Secret Manager bindings and public access
      # (allUsers invoker) are configured on the service once and carried over to each new revision.
      - name: Deploy
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$GCP_PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA \
            --region $GCP_REGION \
            --platform managed \
            --port 8080 \
            --quiet
      - name: Show service URL
        run: gcloud run services describe $SERVICE_NAME --region $GCP_REGION --format='value(status.url)'
